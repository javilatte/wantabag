[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wantabag"
dynamic = ["version"]
description = "Turn Apple Music and Spotify playlists into MP3 files you own."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp[default,deno]>=2026.10.26",
    "mutagen>=1.47",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wantabag = "wantabag.cli:main"

[tool.hatch.version]
path = "src/wantabag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wantabag"]
artifacts = ["src/wantabag/web/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
